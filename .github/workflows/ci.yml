name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.0

jobs:
  build:
    name: Build & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # --frozen-lockfile fails if bun.lock is out of sync with package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # astro check and astro build both sync content types internally
      - name: Type check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      # Reuse the artifact from the build job instead of rebuilding.
      # lighthouserc.json points staticDistDir at ./dist and LHCI serves it
      # itself, so no preview server or deployment is needed.
      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Audit with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          runs: 3
          uploadArtifacts: true
          artifactName: lighthouse-results
