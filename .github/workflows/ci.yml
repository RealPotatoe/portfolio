name: CI

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Build & type check
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version-file: package.json

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Format check
              run: bun run format:check

            - name: Type check
              run: bun run check

            - name: Build
              run: bun run build

            - name: Upload build output
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
              with:
                  name: dist
                  path: dist/
                  retention-days: 7

    lighthouse:
        name: Lighthouse audit
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Download build output
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: dist
                  path: dist

            - name: Audit with Lighthouse CI
              uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
              with:
                  configPath: ./lighthouserc.json
                  runs: 3
                  uploadArtifacts: true
                  artifactName: lighthouse-results

    deploy:
        name: Deploy to GitHub Pages
        runs-on: ubuntu-latest
        needs: [build, lighthouse]
        timeout-minutes: 10
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        concurrency:
            group: pages
            cancel-in-progress: false
        steps:
            # Reuse the artifact from the build job instead of rebuilding.
            - name: Download build output
              uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
              with:
                  name: dist
                  path: dist

            - name: Add CNAME for custom domain
              run: echo "mbengel.dev" > dist/CNAME

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
              with:
                  path: dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
